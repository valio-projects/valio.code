name: valio-code
# Ready-to-run local example; one shared database account for all components.
x-database: &database
  VALIO_DB_URL: http://surrealdb:8000
  VALIO_DB_NAMESPACE: valio
  VALIO_DB_DATABASE: workspace_main
  VALIO_DB_USER: root
  VALIO_DB_PASSWORD: valio
  VALIO_DB_AUTH_LEVEL: root
services:
  migrate:
    build:
      context: .
      dockerfile: src/back-end/Dockerfile
      target: migrate
    environment:
      <<: *database
    depends_on:
      surrealdb:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
  api:
    build:
      context: .
      dockerfile: src/back-end/Dockerfile
      target: api
    environment:
      <<: *database
      VALIO_API_TOKEN: valio-local-development-token-0001
      VALIO_WORKSPACE_ID: workspace-main
      VALIO_API_ADDRESS: "0.0.0.0:8090"
      VALIO_TRUSTED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080"
      OTEL_SERVICE_NAME: valio-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
  worker:
    build:
      context: .
      dockerfile: src/back-end/Dockerfile
      target: worker
    environment:
      <<: *database
      OTEL_SERVICE_NAME: valio-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
  web:
    build:
      context: .
      dockerfile: src/front-end/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, ingress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    user: "65532:65532"
    ports: ["127.0.0.1:16686:16686"]
    networks: [backend, ingress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  volume-init:
    image: alpine:3.23.0@sha256:51183f2cfa6320055da30872f211093f9ff1d3cf06f39a0bdb212314c5dc7375
    user: "0:0"
    command: [chown, "65532:65532", /data]
    volumes:
      - surreal-data:/data
    network_mode: none
    restart: "no"
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843
    user: "65532:65532"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: [start, --bind, "0.0.0.0:8000", "rocksdb:/data/valio.db"]
    environment:
      SURREAL_USER: root
      SURREAL_PASS: valio
    volumes:
      - surreal-data:/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /surreal, isready, --endpoint, "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
networks:
  ingress:
  backend:
    internal: true
volumes:
  surreal-data:
