name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: src/front-end/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  go:
    env:
      VALIO_TEST_SYNTAX_HELPER: ${{ github.workspace }}/src/back-end/analyzers/syntax/index.js
    defaults:
      run:
        working-directory: src/back-end
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
      - run: npm ci --ignore-scripts
        working-directory: src/back-end/analyzers/syntax
      - run: npm test
        working-directory: src/back-end/analyzers/syntax
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/...
  integration:
    runs-on: ubuntu-latest
    env:
      VALIO_TEST_SYNTAX_HELPER: ${{ github.workspace }}/src/back-end/analyzers/syntax/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
      - run: npm ci --ignore-scripts
        working-directory: src/back-end/analyzers/syntax
      - run: docker compose -p valio-code-test -f compose.yaml -f deploy/compose.test.yaml up -d --wait surrealdb jaeger
      - name: Real database integration
        shell: bash
        run: |
          cd src/back-end
          VALIO_TEST_DB_URL=http://127.0.0.1:18000 VALIO_TEST_DB_PASSWORD=valio VALIO_TEST_OTLP_URL=http://127.0.0.1:14318 go test ./...
      - if: always()
        run: docker compose -p valio-code-test -f compose.yaml -f deploy/compose.test.yaml down
