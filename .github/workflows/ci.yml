name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - run: sh scripts/setup.sh
      - run: docker compose -f compose.yaml -f deploy/compose.test.yaml up -d --wait surrealdb jaeger
      - name: Real database integration
        shell: bash
        run: |
          set -a
          source .env
          set +a
          VALIO_TEST_DB_URL=http://127.0.0.1:18000 VALIO_TEST_DB_PASSWORD="$SURREAL_ROOT_PASSWORD" VALIO_TEST_OTLP_URL=http://127.0.0.1:14318 go test ./...
      - if: always()
        run: docker compose -f compose.yaml -f deploy/compose.test.yaml down
